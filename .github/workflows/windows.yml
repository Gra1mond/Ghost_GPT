name: Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/GhostGPT/GhostGPT.csproj -c Release
      - run: dotnet run --project tests/GhostGPT.Checks -c Release
      - name: Publish self-contained Windows x64
        run: dotnet publish src/GhostGPT/GhostGPT.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/GhostGPT-win-x64
      - name: Include documentation and licenses
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GhostGPT-win-x64
          path: artifacts/GhostGPT-win-x64.zip
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GhostGPT-win-x64
          path: release
      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content src/GhostGPT/GhostGPT.csproj)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match application version' }
          $notes = "docs/RELEASE-$env:RELEASE_TAG.md"
          if (!(Test-Path $notes)) { throw "Missing release notes: $notes" }
          $hash = (Get-FileHash release/GhostGPT-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GhostGPT-win-x64.zip" | Set-Content release/SHA256SUMS.txt -Encoding utf8
          gh release create $env:RELEASE_TAG release/GhostGPT-win-x64.zip release/SHA256SUMS.txt --verify-tag --title "Ghost GPT $env:RELEASE_TAG" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
